<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- - Android
    - Java
    - PHP
    - .Net -->

    <!-- Types of LIST
        1. Unordered List
        2. Ordered List -->

        <h1>Unordered List</h1>
    <ul>
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ul>

    <hr>

    <h1>Ordered List</h1>
    <ol>
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ol>

    <ol type="A">
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ol>

    <ol type="a">
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ol>

    <ol type="I">
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ol>

    <ol type="i">
        <li>Android</li>
        <li>Java</li>
        <li>PHP</li>
        <li>Angular</li>
    </ol>

</body>
</html>
